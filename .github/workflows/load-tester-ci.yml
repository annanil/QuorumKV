name: Load Tester CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build shard-controller JAR
        run: |
          cd shard-controller
          mvn package -DskipTests -q
          find target -name "*.jar" ! -name "*.original" | head -1 | xargs -I{} cp {} app.jar

      - name: Build server JAR
        run: |
          ./mvnw package -DskipTests
          find target -name "*.jar" ! -name "*.original" | head -1 | xargs -I{} cp {} app.jar
          ls -lh app.jar

      - name: Build load-tester JAR
        run: cd load-tester && mvn package -DskipTests -q

      - name: Start cluster (W=1 R=1)
        run: docker compose up --build -d
        env:
          WRITE_QUORUM: 1
          READ_QUORUM: 1

      - name: Wait for cluster to be healthy
        run: |
          wait_for_port() {
            local port=$1
            local name=$2
            echo "Waiting for $name on port $port..."
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/kv?key=warmup 2>/dev/null || echo "000")
              if echo "$code" | grep -qE "^(200|404)$"; then
                echo "$name is up (attempt $i)"
                return 0
              fi
              echo "Attempt $i: $name not ready (code=$code), waiting 3s..."
              sleep 3
            done
            echo "ERROR: $name did not come up in time"
            return 1
          }

          wait_for_port 8080 "leader"    || { docker compose logs leader;    exit 1; }
          wait_for_port 8081 "follower1" || { docker compose logs follower1; exit 1; }
          wait_for_port 8082 "follower2" || { docker compose logs follower2; exit 1; }
          wait_for_port 8083 "follower3" || { docker compose logs follower3; exit 1; }
          wait_for_port 8084 "follower4" || { docker compose logs follower4; exit 1; }
          echo "All nodes ready"
          echo "Waiting 10s for internal cluster connections to settle..."
          sleep 10

      - name: Run smoke test (500 requests, 50% writes)
        working-directory: load-tester
        run: |
          java -jar target/load-tester-1.0-SNAPSHOT.jar \
          --write-url=http://localhost:8080 \
          --config=ci-smoke \
          --requests=500 \
          --threads=8 \
          --num-keys=10 \
          --write-pct=50

      - name: Assert zero 5xx errors
        run: python3 load-tester/check_results.py load-tester/output/latencies_ci-smoke.csv --max-error-pct=1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: load-tester/output/

      - name: Test down cluster
        if: always()
        run: docker compose down