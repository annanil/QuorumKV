services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-leaderless.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node1
      - node2
      - node3
      - node4
      - node5

  node1:
    build: .
    environment:
      NODE_ROLE: leaderless
      NODE_PEER_URLS: "http://node2:8080,http://node3:8080,http://node4:8080,http://node5:8080"
      NODE_WRITE_QUORUM_SIZE: ${WRITE_QUORUM:-1}
      NODE_READ_QUORUM_SIZE: ${READ_QUORUM:-1}

  node2:
    build: .
    environment:
      NODE_ROLE: leaderless
      NODE_PEER_URLS: "http://node1:8080,http://node3:8080,http://node4:8080,http://node5:8080"
      NODE_WRITE_QUORUM_SIZE: ${WRITE_QUORUM:-1}
      NODE_READ_QUORUM_SIZE: ${READ_QUORUM:-1}

  node3:
    build: .
    environment:
      NODE_ROLE: leaderless
      NODE_PEER_URLS: "http://node1:8080,http://node2:8080,http://node4:8080,http://node5:8080"
      NODE_WRITE_QUORUM_SIZE: ${WRITE_QUORUM:-1}
      NODE_READ_QUORUM_SIZE: ${READ_QUORUM:-1}

  node4:
    build: .
    environment:
      NODE_ROLE: leaderless
      NODE_PEER_URLS: "http://node1:8080,http://node2:8080,http://node3:8080,http://node5:8080"
      NODE_WRITE_QUORUM_SIZE: ${WRITE_QUORUM:-1}
      NODE_READ_QUORUM_SIZE: ${READ_QUORUM:-1}

  node5:
    build: .
    environment:
      NODE_ROLE: leaderless
      NODE_PEER_URLS: "http://node1:8080,http://node2:8080,http://node3:8080,http://node4:8080"
      NODE_WRITE_QUORUM_SIZE: ${WRITE_QUORUM:-1}
      NODE_READ_QUORUM_SIZE: ${READ_QUORUM:-1}
