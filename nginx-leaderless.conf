upstream leaderless_nodes {
    server node1:8080;
    server node2:8080;
    server node3:8080;
    server node4:8080;
    server node5:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://leaderless_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
