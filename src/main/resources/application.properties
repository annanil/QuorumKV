spring.application.name=assignment4-kv

# Current node role: single, leader, or follower
node.role=single

# Comma-separated follower URLs used by the leader
# node.follower-urls=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084
node.follower-urls=

# Comma-separated peer URLs used by leaderless mode
node.peer-urls=

# Number of nodes required for a successful write
node.write-quorum-size=1

# Number of nodes required for a successful read
node.read-quorum-size=1

# Expose the health endpoint so the ALB health check at /actuator/health returns 200
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
